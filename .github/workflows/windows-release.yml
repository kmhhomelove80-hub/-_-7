name: Build Windows EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomTwoStockTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @'
          Windows 10/11 x64용 두 종목 순환매매 프로그램입니다.
          Python 설치 없이 KiwoomTwoStockTrader.exe를 실행할 수 있습니다.
          ZIP에는 실행파일, 사용설명서, UI 시작 테스트 결과가 들어 있습니다.
          자동 테스트와 Windows UI/패키지 시작 테스트를 통과한 빌드입니다.
          실제 계좌 인증과 주문·체결은 검증하지 않았습니다. 시작 시 자동매매는 중지 상태입니다.
          API 키 및 계좌번호는 사용자 PC에서 입력하며 배포파일에는 포함되지 않습니다.
          코드서명이 없는 실행파일이므로 Windows에서 게시자 미확인 표시가 나올 수 있습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomTwoStockTrader.exe dist/KiwoomTwoStockTrader-Windows-x64.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Windows 실행파일 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
