name: Build local web EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomWebTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @'
          브라우저로 사용하는 PC 로컬 웹 버전입니다. EXE 실행 시 브라우저가 자동으로 열립니다.
          미체결 상세, 중지 사유·대응 방법, 계좌/자동매매 상태 분리, 재개 전 점검을 제공합니다.
          읽기 전용 조회는 최대 2회 추가 재시도하며 주문 자체는 재전송하지 않습니다.
          예약 자동 운영 추가: Windows 예약 작업, 개장 전 점검, 개장 1분 후 자동 시작, 정규장 종료 후 앱 자동 종료.
          예약은 최초 명시 동의가 필요하며 기본 꺼짐입니다. 계좌·전략 변경 또는 위험 중지 후 다시 승인해야 합니다.
          마감 10분 전 신규 주문 차단 유지, 예외 상황만 기본 알림, 거래 알림 선택 가능.
          사용자 중지는 당일 자동 재시작을 막습니다. 비정상 종료 후 매매 자동 재개는 차단합니다.
          PC 켜짐·Windows 로그인 필요. 전원 꺼짐/로그아웃/네트워크 전체 장애 순간에는 알릴 수 없습니다.
          인증정보는 Windows 보안 저장소에 유지합니다.
          로컬 서버는 127.0.0.1에만 열리며 외부 공개 서버에서 거래하지 않습니다.
          기존 데스크톱 앱과 동시에 실행할 수 없습니다. 기존 설정과 진단 DB를 유지합니다.
          Windows 10/11 x64용이며 Python을 따로 설치하지 않습니다.
          자동 테스트, 실제 브라우저(PC/모바일 크기) 및 Windows 패키지 HTTP 검증을 통과한 빌드입니다.
          실제 계좌 주문·체결, 사용자 PC 깨우기 및 휴대폰 수신은 검증하지 않았습니다. 코드서명은 없습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomWebTrader.exe dist/KiwoomWebTrader-Windows-x64.zip dist/SHA256SUMS.txt dist/web-preview.png dist/schedule-preview.png --target '${{ github.sha }}' --title "로컬 웹 버전 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
