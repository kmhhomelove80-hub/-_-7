name: Build local web EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomWebTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.${{ github.run_number }}"
          $notes = @'
          A/B 평균 매입가 대비 수익률 갭 양방향 순환매로 교체했습니다. B 단독 기준가·방향 로직은 제거했습니다.
          당일 시작 잔고 × 비율을 반올림한 고정 매도주수 / 현재 보유수량 비율을 선택합니다.
          거래 후 갭이 기준 미만으로 줄어든 것을 확인한 뒤 다시 기준에 도달해야 재거래합니다.
          매도·매수 모두 시장가. 시장가도 미체결·부분체결·가격 변동이 가능하며 주문은 자동 재전송하지 않습니다.
          매수는 상한가·비용 예비율로 수량을 보수적으로 산정해 실제 매도대금 범위에서 실행합니다.
          최초 실전 동의 후 기간 제한 없이 매 거래일 자동 실행·매매·종료. 사용자 중지는 재승인까지 유지합니다.
          안전한 주문 전 일시적 조회 장애는 30초 후 자동 재점검. 접수 불명·미완료 거래는 대조 전 자동 재개하지 않습니다.
          특별 이슈는 원인·조치·해결 방법을 알리며 정상 알림은 기본 꺼짐입니다.
          이전 버전 예약 동의는 새 전략에서 재승인해야 합니다. 기존 기록·인증정보는 보존합니다.
          Windows 10/11 x64, Python 별도 설치 불필요. PC 전원·Windows 로그인 필요. 코드서명은 없습니다.
          합성 계좌·장기 일정 시뮬레이션·브라우저·Windows 작업 XML 등록·패키지 API 검증을 통과한 빌드입니다.
          실제 실전 주문·체결, 사용자 PC 장기 운영·깨우기, 휴대폰 수신은 검증하지 않았습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomWebTrader.exe dist/KiwoomWebTrader-Windows-x64.zip dist/SHA256SUMS.txt dist/web-preview.png dist/schedule-preview.png dist/strategy-preview.png --target '${{ github.sha }}' --title "A/B 갭·시장가·장기 자동 운영 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
