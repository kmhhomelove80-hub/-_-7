name: Build Windows EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomTwoStockTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @'
          개발 진단 버전: 거래별 판단 근거·자금 계산·주문 진행·중단 사유·후속 조치를 추적번호로 기록합니다.
          거래 설명/진단 화면과 JSON 내보내기를 추가했습니다.
          매수 미전송 / 증권사 거절 / 접수 불명 / 부분체결 / 전량체결을 구분합니다.
          후속 매수 전 현금 조회값만 부족한 경우 최대 10회 추가 재조회하며 주문은 재전송하지 않습니다.
          A→B/B→A 양방향 예상 수량과 거래금액 조건을 표시합니다.
          A/B 순환매 규칙, 현재가 지정가, 잔고 자동갱신, 텔레그램/이메일 알림은 유지합니다.
          역할 교환 및 별도 성과 분석은 이번 진단 수정에 포함하지 않았습니다.
          Windows 10/11 x64용. Python 설치 없이 EXE를 실행합니다.
          자동 테스트와 Windows 원본/EXE UI 시작 테스트를 통과한 빌드입니다.
          실제 계좌 주문·체결과 사용자 휴대폰 수신은 검증하지 않았습니다.
          코드서명이 없어 Windows에 게시자 미확인 표시가 나올 수 있습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomTwoStockTrader.exe dist/KiwoomTwoStockTrader-Windows-x64.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Windows 실행파일 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
