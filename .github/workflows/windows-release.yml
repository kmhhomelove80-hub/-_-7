name: Build Windows EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomTwoStockTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @'
          A 자금 ETF / B 변동 종목의 직전 실제 B 체결가 기준 순환매로 전략을 변경했습니다.
          B 매도 후 하락 시 A→B, B 매수 후 상승 시 B→A로 번갈아 거래합니다.
          한도는 A+B 합산 매입원금 100만원~10억원입니다. 기준가/방향을 재시작 후에도 유지합니다.
          텔레그램 휴대폰 푸시를 기본 알림으로, 이메일 알림을 선택 기능으로 추가했습니다.
          계좌 잔고·예수금·평가손익 약 5초 자동갱신을 유지합니다.
          Windows 10/11 x64용이며 Python 설치 없이 EXE를 실행할 수 있습니다.
          자동 테스트 및 Windows 원본/EXE UI 시작 테스트를 통과한 빌드입니다.
          실계좌 주문·체결 및 사용자 텔레그램/SMTP 수신은 검증하지 않았습니다.
          실행만으로 자동매매를 시작하지 않습니다. 설정과 사용설명서를 확인하세요.
          코드서명이 없어 Windows에 게시자 미확인 표시가 나올 수 있습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomTwoStockTrader.exe dist/KiwoomTwoStockTrader-Windows-x64.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Windows 실행파일 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
