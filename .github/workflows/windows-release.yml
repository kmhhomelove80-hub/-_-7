name: Build Windows EXE and publish release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiwoomTwoStockTrader-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @'
          상단 설정을 별도 탭으로 옮기고 잔고·주문/체결 내역을 기본 화면에 크게 배치했습니다.
          표 높이를 조절할 수 있고 진행 로그 탭과 스크롤을 제공합니다.
          현금 계산의 일반 주문가능금액 추가 제한을 수정하고 종목별 kt00010 100% 주문가능금액/수량을 확인합니다.
          특정 체결조회 자료 없음(501724)은 제한 시간 안에 조회를 계속하며 주문을 재전송하지 않습니다.
          이전 미완료 거래나 누락된 매수는 자동 복구하지 않습니다.
          Windows 10/11 x64용. Python 설치 없이 EXE를 실행합니다.
          자동 테스트와 Windows 원본/EXE UI 및 1024x720 표시 높이 검증을 통과한 빌드입니다.
          실제 계좌의 새 주문·체결과 사용자 알림 수신은 검증하지 않았습니다.
          코드서명이 없어 Windows에 게시자 미확인 표시가 나올 수 있습니다.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/KiwoomTwoStockTrader.exe dist/KiwoomTwoStockTrader-Windows-x64.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Windows 실행파일 $tag" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
